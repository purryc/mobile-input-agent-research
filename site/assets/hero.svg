<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title desc"><title id="title">手机把人的意图连接到多个执行端</title><desc id="desc">概念示意：用户经手机表达目标、确认权限和验收结果，任务在电脑、云、手机应用及家庭设备执行。手表和耳机是补充入口。</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#a1aca8" stroke-width="1.5"/></marker></defs><rect x="0" y="0" width="640" height="480" rx="20" fill="#eef3ee"/><g stroke="#b2beb7" stroke-width="1.5" fill="none" marker-end="url(#a)"><path d="M310 150H386V95H451"/><path d="M310 210H451"/><path d="M310 275H386V330H451"/><path d="M92 218H170"/><path d="M110 380H204V355"/></g><g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif"><text x="30" y="35" fill="#75847e" font-size="11" letter-spacing="2">HUMAN INPUT · VISIBLE CONTROL</text><rect x="166" y="67" width="150" height="314" rx="28" fill="#182d2b"/><rect x="174" y="75" width="134" height="298" rx="22" fill="white"/><rect x="214" y="83" width="54" height="10" rx="5" fill="#182d2b"/><text x="190" y="126" fill="#75847e" font-size="10">电脑 A · 研究任务</text><text x="190" y="155" fill="#183e33" font-size="17" font-weight="600">需要你的决定</text><rect x="187" y="173" width="108" height="62" rx="8" fill="#edf3ec"/><text x="197" y="192" fill="#547465" font-size="10">目标 / 对象 / 权限</text><text x="197" y="212" fill="#183e33" font-size="12">把这份资料接着做完</text><rect x="187" y="245" width="108" height="29" rx="6" fill="#17634d"/><text x="216" y="264" fill="white" font-size="11">确认这一步</text><rect x="187" y="283" width="51" height="29" rx="6" fill="#f5efef"/><text x="201" y="302" fill="#b24445" font-size="11">停止</text><rect x="245" y="283" width="50" height="29" rx="6" fill="#eef2ef"/><text x="254" y="302" fill="#305442" font-size="11">改目标</text><circle cx="241" cy="343" r="14" fill="#e2ebe2"/><path d="M241 336v12m-5-10v7m10-7v7" stroke="#2a5744" stroke-width="2" stroke-linecap="round"/><g fill="whi